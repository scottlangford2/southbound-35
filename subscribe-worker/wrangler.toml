name = "southbound35-subscribe"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The blog origin allowed to POST the signup form (CORS).
[vars]
ALLOW_ORIGIN = "https://scottlangford2.github.io"

# D1 database binding.
[[d1_databases]]
binding = "DB"
database_name = "southbound35-subscribers"
database_id = "d77bd648-7160-486b-8a7b-588ee4de2d9a"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put ADMIN_KEY          (required, gates /export)
#   wrangler secret put TURNSTILE_SECRET   (optional, enables Turnstile checks)
