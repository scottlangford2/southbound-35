# Cloudflare Workers config for the Southbound 35 subscribe endpoint.
#
# Deploy:
#   npm install -g wrangler
#   wrangler login
#   wrangler kv namespace create SUBSCRIBERS
#   # paste the printed namespace id into [[kv_namespaces]] below
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put NOTIFY_EMAIL
#   wrangler secret put ADMIN_TOKEN
#   wrangler deploy

name = "southbound-35-subscribe"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Non-secret config (visible in dashboard). Override per environment if needed.
[vars]
FROM_EMAIL = "Southbound 35 <onboarding@resend.dev>"
ALLOWED_ORIGIN = "https://scottlangford2.github.io"
WORKER_URL = "https://southbound-35-subscribe.YOUR-SUBDOMAIN.workers.dev"

# KV namespace for the subscriber list.
# Run:  wrangler kv namespace create SUBSCRIBERS
# Paste the returned id into the `id` field below.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_WITH_KV_ID_FROM_WRANGLER_CREATE"

# Optional: bind a preview namespace for local dev.
# [[kv_namespaces]]
# binding = "SUBSCRIBERS"
# id = "REPLACE_WITH_PROD_ID"
# preview_id = "REPLACE_WITH_PREVIEW_ID"
